<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script src="node_modules/live2dcubismcore/live2d.min.js"></script>
<script src="node_modules/pixi.js/dist/browser/pixi.min.js"></script>
<script src="node_modules/pixi-live2d-display/dist/cubism2.min.js"></script>
</head><body><canvas id="c"></canvas>
<script>
let app, model, params = {};
window.setup = async (url, size) => {
  app = new PIXI.Application({ view: document.getElementById('c'), width: size, height: size,
    backgroundAlpha: 0, preserveDrawingBuffer: true, autoStart: false, antialias: true });
  model = await PIXI.live2d.Live2DModel.from(url, { autoInteract: false, autoUpdate: false });
  const im = model.internalModel;
  im.motionManager.stopAllMotions();
  im.motionManager.update = () => false;   // no idle motions
  im.eyeBlink = undefined;                 // eyes are driven by the frame list
  im.updateNaturalMovements = () => {};    // no breathing sway, so every render is deterministic
  im.updateFocus = () => {};
  im.on('beforeModelUpdate', () => {
    for (const [k, v] of Object.entries(params)) { try { im.coreModel.setParamFloat(k, v); } catch (e) {} }
  });
  app.stage.addChild(model);
};
// Renders one pose: physics runs `ticks` frames so hair settles before the capture.
window.frame = (p, place, ticks) => {
  params = p || {};
  model.scale.set(place.scale); model.x = place.x; model.y = place.y;
  for (let i = 0; i < ticks; i++) model.update(1000 / 60);
  app.renderer.render(app.stage);
  return app.view.toDataURL('image/png');
};
</script></body></html>
